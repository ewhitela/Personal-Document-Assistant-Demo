[project]
name = "pdva"
version = "1.0.0"
description = "Personal Document Voice Assistant: local, private, voice-driven document Q&A"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    # Week 4: document embedding and retrieval
    "sentence-transformers==2.7.0",
    "transformers==4.40.0",
    "torch==2.2.2",
    "numpy==1.26.4",
    "chromadb>=0.5",
    "pypdf>=4.0",
    # Week 5: local LLM inference (also install the ollama app, then: ollama pull llama3.2:3b)
    "ollama>=0.3",
    # Week 7: speech-to-text
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    # Week 8: text-to-speech (then: python -m piper.download_voices en_US-lessac-medium)
    "piper-tts>=1.2",
    # Week 9 (optional): remote vision backend
    "requests>=2.31",
    # Week 10: integration service and UI
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "streamlit>=1.39",          # st.audio_input needs >=1.39
]

[project.optional-dependencies]
# Wake-word voice loop (demo_voice.py); CPU-only onnxruntime path
voice = [
    "openwakeword>=0.6",
    "onnxruntime==1.20.0",      # >=1.21 silently breaks openwakeword 0.6.x classifiers (no exception, just degenerate output)
    "webrtcvad-wheels>=2.0",    # not `webrtcvad`: no py3.11 prebuilt wheels
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",              # fastapi TestClient
]

[tool.uv]
# uv.lock is committed and is the single source of truth for both machines.
# It resolves all platforms from one `uv lock` run, so regenerate it on the
# workstation only.
#
# CUDA note: torch is pinned to 2.2.2 from the cu118 index on Linux (see
# [tool.uv.sources]). This is deliberate — the 1080 Ti is Pascal (SM 6.1) and
# needs the cuDNN 8 build; newer CUDA wheels drop compute capability < 7.5.
# STT and TTS run on CPU and the LLM lives in ollama, so nothing in this venv
# actually touches the GPU; the pin exists to stop an unrelated upgrade from
# dragging in a cuDNN 9 stack that breaks onnxruntime and faster-whisper.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pdva"]

[tool.ruff.lint]
ignore = [
    # Health checks and UI handlers must not raise; broad catch is intentional.
    "BLE001",
    # FastAPI's Depends/File/Form idiom requires calls in argument defaults.
    "B008",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.uv.sources]
# Linux only. The cu118 index publishes no macOS wheels, so an unconditional
# source here makes `uv sync` unresolvable on the MacBook. On macOS uv falls
# back to PyPI, which serves CPU/MPS wheels for torch 2.2.2.
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
